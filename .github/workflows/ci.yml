name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # No environment needed: the database pool is opened lazily, so nothing
      # requires a secret to compile.
      - name: Build
        run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # .env is gitignored, and compose refuses to parse without it. Building
      # it from the example also proves .env.example stays complete enough for
      # the documented quick start to work.
      - name: Create .env from the example
        run: cp .env.example .env

      - name: Validate compose file
        run: docker compose config --quiet
