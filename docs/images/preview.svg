<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica Neue, Arial, sans-serif">
  <title>AskYourDocs answering a question with verified citations</title>

  <!-- page -->
  <rect width="1400" height="900" fill="#131519"/>

  <!-- app window -->
  <rect x="24" y="24" width="1352" height="852" rx="14" fill="#1b1d22" stroke="#3a3e46" stroke-width="1"/>

  <!-- title bar -->
  <path d="M24 38a14 14 0 0 1 14-14h1324a14 14 0 0 1 14 14v34H24z" fill="#24262c"/>
  <line x1="24" y1="72" x2="1376" y2="72" stroke="#3a3e46" stroke-width="1"/>
  <circle cx="52" cy="48" r="5.5" fill="#4b5059"/>
  <circle cx="72" cy="48" r="5.5" fill="#4b5059"/>
  <circle cx="92" cy="48" r="5.5" fill="#4b5059"/>
  <rect x="560" y="37" width="280" height="23" rx="11.5" fill="#1b1d22"/>
  <text x="700" y="53" fill="#a4a8b0" font-size="12" text-anchor="middle">localhost:3000/chat</text>

  <!-- ───────────── sidebar ───────────── -->
  <path d="M24 72h240v790a14 14 0 0 1-14 14H38a14 14 0 0 1-14-14z" fill="#202329"/>
  <line x1="264" y1="72" x2="264" y2="876" stroke="#3a3e46" stroke-width="1"/>

  <!-- logo -->
  <g transform="translate(48,100)" stroke="#8fa8ff" stroke-width="1.6" fill="none" stroke-linejoin="round">
    <path d="M2 1h9l6 6v15H2z"/>
    <path d="M11 1v6h6"/>
    <circle cx="9.5" cy="13" r="3.6"/>
    <path d="m12.3 15.8 3 3" stroke-linecap="round"/>
  </g>
  <text x="80" y="118" fill="#edeef0" font-size="16" font-weight="600">AskYourDocs</text>

  <!-- nav -->
  <text x="48" y="168" fill="#a4a8b0" font-size="14">Documents</text>
  <rect x="36" y="184" width="204" height="34" rx="9" fill="#2f3550"/>
  <text x="48" y="206" fill="#8fa8ff" font-size="14" font-weight="500">Chat</text>
  <text x="48" y="246" fill="#a4a8b0" font-size="14">Search</text>
  <text x="48" y="284" fill="#a4a8b0" font-size="14">Admin</text>

  <line x1="36" y1="312" x2="240" y2="312" stroke="#3a3e46" stroke-width="1"/>
  <text x="48" y="340" fill="#7b8089" font-size="10.5" letter-spacing="0.9">RECENT</text>

  <rect x="36" y="352" width="204" height="30" rx="8" fill="#2a2d34"/>
  <text x="48" y="372" fill="#edeef0" font-size="13">Refund policy</text>
  <text x="48" y="406" fill="#a4a8b0" font-size="13">Onboarding checklist</text>
  <text x="48" y="440" fill="#a4a8b0" font-size="13">Security questionnaire</text>

  <!-- account -->
  <line x1="36" y1="792" x2="240" y2="792" stroke="#3a3e46" stroke-width="1"/>
  <text x="48" y="820" fill="#edeef0" font-size="13" font-weight="500">Deepanshu</text>
  <text x="48" y="838" fill="#7b8089" font-size="11.5">Administrator</text>

  <!-- ───────────── conversation ───────────── -->

  <!-- question -->
  <rect x="828" y="104" width="512" height="44" rx="14" fill="#8fa8ff"/>
  <path d="M1326 148h14v-14z" fill="#8fa8ff"/>
  <text x="1316" y="132" fill="#1b1d22" font-size="15" text-anchor="end">What is the refund window for annual plans?</text>

  <!-- answer -->
  <text x="300" y="204" fill="#edeef0" font-size="15">Refund requests must be submitted within 30 days of purchase.</text>
  <rect x="742" y="190" width="19" height="17" rx="4" fill="#2f3550"/>
  <text x="751.5" y="203" fill="#8fa8ff" font-size="11" font-weight="700" text-anchor="middle">1</text>

  <text x="300" y="240" fill="#edeef0" font-size="15">Annual plans purchased under a negotiated contract follow the terms of that</text>
  <text x="300" y="266" fill="#edeef0" font-size="15">contract instead, including any longer refund window.</text>
  <rect x="700" y="252" width="19" height="17" rx="4" fill="#2f3550"/>
  <text x="709.5" y="265" fill="#8fa8ff" font-size="11" font-weight="700" text-anchor="middle">2</text>

  <!-- the unsupported claim -->
  <text x="300" y="308" fill="#edeef0" font-size="15">Enterprise customers receive an extended 90-day refund window.</text>
  <rect x="744" y="294" width="19" height="17" rx="4" fill="#2f3550"/>
  <text x="753.5" y="307" fill="#8fa8ff" font-size="11" font-weight="700" text-anchor="middle">2</text>
  <path d="M300 315q4-4 8 0t8 0t8 0t8 0t8 0t8 0t8 0t8 0t8 0t8 0t8 0t8 0t8 0t8 0t8 0t8 0t8 0t8 0t8 0t8 0t8 0t8 0t8 0t8 0t8 0t8 0t8 0t8 0t8 0t8 0t8 0t8 0t8 0t8 0t8 0t8 0t8 0t8 0t8 0t8 0t8 0t8 0t8 0t8 0t8 0t8 0t8 0t8 0t8 0t8 0t8 0t8 0t8 0t8 0"
        fill="none" stroke="#ff8a7a" stroke-width="1.6"/>
  <text x="774" y="305" fill="#ff8a7a" font-size="10.5" font-weight="700">unverified</text>

  <!-- badges -->
  <rect x="300" y="344" width="196" height="26" rx="7" fill="#4a2a26"/>
  <text x="314" y="361" fill="#ff8a7a" font-size="12" font-weight="600">67% grounded · 1 unsupported</text>

  <rect x="508" y="344" width="118" height="26" rx="7" fill="#24262c"/>
  <text x="522" y="361" fill="#a4a8b0" font-size="12">Hide 2 sources</text>

  <!-- sources -->
  <rect x="300" y="386" width="1040" height="86" rx="11" fill="#1f2228" stroke="#3a3e46" stroke-width="1"/>
  <rect x="316" y="404" width="17" height="17" rx="4" fill="#2f3550"/>
  <text x="324.5" y="417" fill="#8fa8ff" font-size="11" font-weight="700" text-anchor="middle">1</text>
  <text x="344" y="417" fill="#edeef0" font-size="12.5" font-weight="600">Billing Policy 2026.pdf</text>
  <text x="510" y="417" fill="#7b8089" font-size="12">· page 4</text>
  <text x="316" y="441" fill="#a4a8b0" font-size="12">Refund requests must be submitted within 30 days of purchase. Requests made after that window are</text>
  <text x="316" y="459" fill="#a4a8b0" font-size="12">declined automatically by the billing system.</text>

  <rect x="300" y="482" width="1040" height="86" rx="11" fill="#1f2228" stroke="#3a3e46" stroke-width="1"/>
  <rect x="316" y="500" width="17" height="17" rx="4" fill="#2f3550"/>
  <text x="324.5" y="513" fill="#8fa8ff" font-size="11" font-weight="700" text-anchor="middle">2</text>
  <text x="344" y="513" fill="#edeef0" font-size="12.5" font-weight="600">Billing Policy 2026.pdf</text>
  <text x="510" y="513" fill="#7b8089" font-size="12">· Exceptions</text>
  <text x="316" y="537" fill="#a4a8b0" font-size="12">Annual plans purchased under a negotiated contract follow the terms of that contract instead of this</text>
  <text x="316" y="555" fill="#a4a8b0" font-size="12">policy, including any longer refund window.</text>

  <!-- follow-up question -->
  <rect x="1004" y="608" width="336" height="44" rx="14" fill="#8fa8ff"/>
  <path d="M1326 652h14v-14z" fill="#8fa8ff"/>
  <text x="1316" y="636" fill="#1b1d22" font-size="15" text-anchor="end">Who signs off on an exception?</text>

  <!-- grounded refusal -->
  <rect x="300" y="684" width="700" height="46" rx="10" fill="#24262c" stroke="#3a3e46" stroke-width="1"/>
  <text x="318" y="713" fill="#a4a8b0" font-size="14.5">I could not find anything in your documents that answers that.</text>

  <!-- composer -->
  <line x1="264" y1="770" x2="1376" y2="770" stroke="#3a3e46" stroke-width="1"/>
  <rect x="300" y="796" width="928" height="42" rx="10" fill="#24262c" stroke="#3a3e46" stroke-width="1"/>
  <text x="318" y="822" fill="#7b8089" font-size="14">Ask a question about your documents…</text>
  <rect x="1244" y="796" width="96" height="42" rx="10" fill="#8fa8ff"/>
  <text x="1292" y="822" fill="#1b1d22" font-size="14" font-weight="600" text-anchor="middle">Ask</text>
</svg>
