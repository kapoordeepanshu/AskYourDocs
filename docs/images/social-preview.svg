<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica Neue, Arial, sans-serif">
  <title>AskYourDocs — every citation, checked before you see it</title>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#191c22"/>
      <stop offset="0.55" stop-color="#15171c"/>
      <stop offset="1" stop-color="#12141a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.18" r="0.62">
      <stop offset="0" stop-color="#8fa8ff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#8fa8ff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#glow)"/>
  <rect x="0" y="0" width="1280" height="5" fill="#8fa8ff"/>

  <!-- ── left column ── -->
  <g transform="translate(72,64)" stroke="#8fa8ff" stroke-width="1.9" fill="none" stroke-linejoin="round">
    <path d="M2 1h10l7 7v17H2z"/>
    <path d="M12 1v7h7"/>
    <circle cx="10.5" cy="14.5" r="4.2"/>
    <path d="m13.7 17.8 3.6 3.6" stroke-linecap="round"/>
  </g>
  <text x="112" y="86" fill="#edeef0" font-size="21" font-weight="600" letter-spacing="-0.2">AskYourDocs</text>

  <text x="72" y="196" fill="#f4f5f7" font-size="52" font-weight="700" letter-spacing="-1.4">Every citation,</text>
  <text x="72" y="256" fill="#f4f5f7" font-size="52" font-weight="700" letter-spacing="-1.4">checked before</text>
  <text x="72" y="316" fill="#8fa8ff" font-size="52" font-weight="700" letter-spacing="-1.4">you see it.</text>

  <text x="72" y="372" fill="#a4a8b0" font-size="20">Self-hosted, open-source document Q&amp;A for teams.</text>
  <text x="72" y="402" fill="#a4a8b0" font-size="20">Upload a PDF, DOCX, HTML file, or paste a URL.</text>

  <!-- pills -->
  <rect x="72" y="440" width="176" height="36" rx="18" fill="#232730" stroke="#3a3e46"/>
  <text x="160" y="464" fill="#c9ccd2" font-size="14.5" text-anchor="middle">Verified citations</text>

  <rect x="260" y="440" width="168" height="36" rx="18" fill="#232730" stroke="#3a3e46"/>
  <text x="344" y="464" fill="#c9ccd2" font-size="14.5" text-anchor="middle">Hybrid retrieval</text>

  <rect x="440" y="440" width="188" height="36" rx="18" fill="#232730" stroke="#3a3e46"/>
  <text x="534" y="464" fill="#c9ccd2" font-size="14.5" text-anchor="middle">Runs fully offline</text>

  <text x="72" y="556" fill="#7b8089" font-size="16">github.com/kapoordeepanshu/AskYourDocs</text>
  <text x="72" y="582" fill="#5f646d" font-size="14">Next.js · Postgres + pgvector · Apache 2.0</text>

  <!-- ── right: answer card ── -->
  <rect x="700" y="120" width="508" height="400" rx="16" fill="#1e2128" stroke="#3a3e46"/>

  <text x="732" y="166" fill="#7b8089" font-size="13">Refund window for annual plans?</text>
  <line x1="732" y1="186" x2="1176" y2="186" stroke="#3a3e46"/>

  <text x="732" y="222" fill="#e3e5e8" font-size="15">Requests must be submitted within</text>
  <text x="732" y="248" fill="#e3e5e8" font-size="15">30 days of purchase.</text>
  <rect x="912" y="234" width="19" height="17" rx="4" fill="#2f3550"/>
  <text x="921.5" y="247" fill="#8fa8ff" font-size="11" font-weight="700" text-anchor="middle">1</text>

  <text x="732" y="292" fill="#e3e5e8" font-size="15">Negotiated contracts follow their own</text>
  <text x="732" y="318" fill="#e3e5e8" font-size="15">terms instead.</text>
  <rect x="836" y="304" width="19" height="17" rx="4" fill="#2f3550"/>
  <text x="845.5" y="317" fill="#8fa8ff" font-size="11" font-weight="700" text-anchor="middle">2</text>

  <!-- unsupported claim -->
  <text x="732" y="362" fill="#e3e5e8" font-size="15">Enterprise gets a 90-day window.</text>
  <rect x="960" y="348" width="19" height="17" rx="4" fill="#2f3550"/>
  <text x="969.5" y="361" fill="#8fa8ff" font-size="11" font-weight="700" text-anchor="middle">2</text>
  <path d="M732 370q4.5-5 9 0t9 0t9 0t9 0t9 0t9 0t9 0t9 0t9 0t9 0t9 0t9 0t9 0t9 0t9 0t9 0t9 0t9 0t9 0t9 0t9 0t9 0t9 0t9 0t9 0"
        fill="none" stroke="#ff8a7a" stroke-width="1.9"/>
  <text x="990" y="359" fill="#ff8a7a" font-size="11.5" font-weight="700">unverified</text>

  <rect x="732" y="402" width="216" height="30" rx="8" fill="#4a2a26"/>
  <text x="748" y="422" fill="#ff8a7a" font-size="13.5" font-weight="600">67% grounded · 1 unsupported</text>

  <line x1="732" y1="456" x2="1176" y2="456" stroke="#3a3e46"/>
  <text x="732" y="488" fill="#7b8089" font-size="13">The cited passage does not say that,</text>
  <text x="732" y="506" fill="#7b8089" font-size="13">so the claim is flagged, not hidden.</text>
</svg>
